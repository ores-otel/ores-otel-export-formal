name: Formal spec path guard
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  spec-path:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - run: python3 scripts/validate_manifest.py
      - run: python3 -m unittest discover -s scripts -p 'test_manifest_path.py' -v
